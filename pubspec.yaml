name: speed_math_with_ai
description: "Mental Calculation Tricks - Master rapid mental calculation shortcuts and techniques"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.5
  fl_chart: ^0.70.2
  audioplayers: ^6.7.1
  vibration: ^3.1.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  google_mobile_ads: ^7.0.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/fonts/licenses/
    - assets/sounds/
    - assets/sounds/correct.mp3
    - assets/sounds/wrong.mp3
    - assets/coach/
    - assets/coach/phrases.json
    - assets/coach/intents.json
    - assets/coach/coach_phrases.json
    - assets/coach/tips.json
    - assets/coach/insight_phrases.json
    - assets/coach/habit_phrases.json
    - assets/coach/reminder_phrases.json
    - assets/lessons/
    - assets/lessons/lessons_en.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/icon_main.png"
  adaptive_icon_background: "assets/logo/icon_background.png"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo/splash_640.png"
  android_12:
    image: "assets/logo/splash_1152.png"
    icon_background_color: "#ffffff"