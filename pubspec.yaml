name: speed_math_with_ai
description: "Speed Math with AI - Master mental calculation for competitive exams"
publish_to: 'none'
version: 1.5.0+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.5
  fl_chart: ^0.70.2
  audioplayers: ^6.7.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/sounds/
    - assets/sounds/correct.mp3
    - assets/sounds/wrong.mp3
    - assets/coach/
    - assets/coach/phrases.json
    - assets/coach/intents.json
    - assets/coach/coach_phrases.json
    - assets/coach/tips.json
    - assets/coach/insight_phrases.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
